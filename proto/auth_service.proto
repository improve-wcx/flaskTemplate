syntax = "proto3";

package projecttemplate;

import "common.proto";

// 认证请求消息
message AuthRequest {
  string username = 1;
  string password = 2;
  string device_id = 3;
}

// 认证响应消息
message AuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
  string token_type = 4;
  UserPayload user = 5;
}

// 用户负载信息
message UserPayload {
  string user_id = 1;
  string username = 2;
  string email = 3;
  repeated string roles = 4;
}

// 刷新令牌请求
message RefreshTokenRequest {
  string refresh_token = 1;
}

// 登出请求
message LogoutRequest {
  string access_token = 1;
}

// 认证服务
service AuthService {
  // 用户登录
  rpc Login(AuthRequest) returns (AuthResponse);
  
  // 刷新令牌
  rpc RefreshToken(RefreshTokenRequest) returns (AuthResponse);
  
  // 用户登出
  rpc Logout(LogoutRequest) returns (CommonResponse);
  
  // 验证令牌
  rpc VerifyToken(AuthRequest) returns (UserPayload);
}
