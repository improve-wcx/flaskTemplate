syntax = "proto3";

package projecttemplate;

// 通用空消息
message Empty {}

// 通用消息
message Message {
  string type = 1;
  string content = 2;
  map<string, string> metadata = 3;
  int64 timestamp = 4;
}

// 错误消息
message Error {
  int32 code = 1;
  string message = 2;
  string field = 3;
  string details = 4;
}

// 通用状态码
enum StatusCode {
  STATUS_CODE_UNSPECIFIED = 0;
  STATUS_CODE_SUCCESS = 1;
  STATUS_CODE_FAILURE = 2;
  STATUS_CODE_NOT_FOUND = 3;
  STATUS_CODE_UNAUTHORIZED = 4;
  STATUS_CODE_INVALID_INPUT = 5;
}

// 通用响应消息
message CommonResponse {
  StatusCode status_code = 1;
  string message = 2;
  string request_id = 3;
}
