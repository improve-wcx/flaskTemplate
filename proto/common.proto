syntax = "proto3";

package common;

// 通用状态码
enum StatusCode {
  STATUS_CODE_UNSPECIFIED = 0;
  STATUS_CODE_SUCCESS = 1;
  STATUS_CODE_FAILURE = 2;
  STATUS_CODE_NOT_FOUND = 3;
  STATUS_CODE_UNAUTHORIZED = 4;
  STATUS_CODE_INVALID_INPUT = 5;
}

// 通用响应消息
message CommonResponse {
  StatusCode status_code = 1;
  string message = 2;
  string request_id = 3;
}

// 分页请求
message PaginationRequest {
  int32 page = 1;
  int32 page_size = 2;
}

// 分页响应
message PaginationResponse {
  int32 total_count = 1;
  int32 page = 2;
  int32 page_size = 3;
  int32 total_pages = 4;
}
