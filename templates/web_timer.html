<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 提醒助手</title>
    <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/css/web_timer_style.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1>Web 提醒助手</h1>
            <div id="global-clock" class="clock">0000-00-00 00:00:00</div>
        </header>

        <section class="add-task-section card">
            <h3 class="section-title">创建提醒任务</h3>
            <div class="form-container">
                <div class="input-row">
                    <div class="time-inputs">
                        <input type="number" id="input-h" placeholder="00" min="0">
                        <span class="sep">:</span>
                        <input type="number" id="input-m" placeholder="00" min="0" max="59">
                        <span class="sep">:</span>
                        <input type="number" id="input-s" placeholder="00" min="0" max="59">
                    </div>
                    <select id="input-audio" class="custom-select">
                        <option value="">加载铃声中...</option>
                    </select>
                    <button id="preview-btn" class="btn btn-preview" type="button" title="试听当前铃声">▶ 试听铃声</button>
                </div>
                <div class="action-row">
                    <textarea id="input-remark" placeholder="想要提醒自己什么内容？" class="custom-textarea"></textarea>
                    <button id="add-btn" class="btn btn-add">添加任务</button>
                </div>
            </div>
        </section>

        <section class="task-list-section card">
            <div class="list-header">
                <h3 class="section-title">任务列表</h3>
                <div class="data-controls">
                    <button id="export-btn" class="btn btn-sm btn-outline" title="导出任务列表为 JSON">导出数据</button>
                    <button id="import-btn" class="btn btn-sm btn-outline" title="导入 JSON 任务文件">导入数据</button>
                    <input type="file" id="file-input" accept=".json" style="display: none;">
                </div>
            </div>
            <div class="table-wrapper">
                <table class="task-table">
                    <thead>
                        <tr>
                            <th style="width: 15%;">剩余时间</th>
                            <th style="width: 20%;">开始时间</th>
                            <th style="width: 25%;">备注</th>
                            <th style="width: 15%;">提醒铃声</th>
                            <th style="width: 25%;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="task-tbody">
                        </tbody>
                </table>
            </div>
        </section>
    </div>
    <script src="/static/js/web_timer_script.js"></script>
</body>
</html>
